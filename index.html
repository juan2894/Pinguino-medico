<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pingüino Médico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <figure class="logo">
            <img src="./imagenes/pinguino-medico.svg" alt="Logo de Pingüino Médico">
            <figcaption class="visually-hidden">Logo de Pingüino Médico</figcaption>
        </figure>
    </header>
    <main>
        <section class="texto1" id="main-title">
            <h1>Tus historias clínicas en tiempo record</h1>
        </section>
        <section class="botones">
            <a href="segundo.html" class="registro btn" aria-label="Nuevo Registro">Nuevo registro</a>
            <button type="button" class="historia btn" aria-label="Historia Clinica" id="historiaClinicaBtn">Historia clínica</button>
        </section>
    </main>
    <!--
      BUENA PRÁCTICA: Separación de responsabilidades.
      El código JavaScript se ha movido a su propio archivo (index.js).
      Esto hace que el HTML sea más limpio y el código más fácil de mantener.
      El atributo "defer" asegura que el script se ejecute después de que el HTML ha sido analizado,
      evitando errores si el script intenta acceder a elementos que aún no se han cargado.
    -->
    <script src="index.js" defer></script>
</body>
</html>
