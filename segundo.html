<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>

    <!-- Optimización del título y del meta charset -->
    <meta name="description" content="Formulario de historia clínica">
    <meta name="keywords" content="historia clínica, formulario, paciente">
    <meta name="author" content="Industrias Animadas">

    <!-- Mejorar el rendimiento con la etiqueta rel para evitar bloqueos de renderizado -->
    <link rel="stylesheet" href="segundo.css">

    <!-- Asegurarnos de que el script no bloquee la carga de la página -->
    <script defer src="segundo.js"></script>
</head>

<body>
  <header>
    <figure>
     <a href="index.html" aria-label="Volver a la página principal">
              <img src="./imagenes/arrow-left.png" class="flecha" alt="Regresar">
      </a>
    </figure>
   <h1 class="titulo">Historia Clínica</h1>
    <figure>
      <img src="./imagenes/pinguino-medico.svg" class="logo" alt="Logo Médico">
    </figure>
  </header>

  <main>
    <!--
      BUENA PRÁCTICA: Uso de un único formulario.
      Todos los campos de entrada se han agrupado en un solo <form>.
      Esto es crucial para que al presionar el botón "submit", todos los datos
      puedan ser capturados y procesados juntos.
      
      ERROR CORREGIDO: Se eliminó el atributo `onsubmit` en línea. La gestión del envío
      del formulario se hará completamente en `segundo.js` para una mejor separación
      de responsabilidades (HTML para estructura, JS para comportamiento).
    -->
    <form id="historiaClinicaForm">
      <section class="principales">
        <h2 class="titulo2">Datos del paciente</h2>
        <div class="datos1">
          <!--
            BUENA PRÁCTICA: Atributos `for`, `id`, y `name`.
            - `id`: Identificador único para el input.
            - `name`: Nombre usado para agrupar datos en el formulario. Crucial para la captura de datos.
            - `for` en `label`: Se asocia con el `id` del `input` para mejorar la accesibilidad.
              (Hacer clic en el label ahora enfoca el input).

            ERROR CORREGIDO: El atributo `required` se movió de la etiqueta <label> al <input>,
            que es donde tiene efecto para la validación del navegador.
          -->
          <label for="nombrePaciente" class="nombre">
            <span>Nombre del paciente:</span>
            <input type="text" id="nombrePaciente" name="nombrePaciente" placeholder="Juan Carlos Rodríguez" required>
          </label>
          <label for="documentoIdentidad" class="identidad">
            <span>Documento de identidad:</span>
            <input type="number" id="documentoIdentidad" name="documentoIdentidad" placeholder="90954346">
          </label>
          <label for="edad" class="edad">
            <span>Edad:</span>
            <input type="number" id="edad" name="edad" placeholder="43" required>
          </label>
          <label for="sintomaPrincipal" class="sintoma1">
            <span>Síntoma principal:</span>
            <select name="sintomaPrincipal" id="sintomaPrincipal" required>
              <option value="">Seleccione un síntoma</option>
              <option value="Fiebre">Fiebre</option>
              <option value="Dolor abdominal">Dolor abdominal</option>
              <option value="Cefalea">Cefalea</option>
              <option value="Dolor toráxico">Dolor toráxico</option>
              <option value="Síncope o colapso">Síncope o colapso</option>
            </select>
          </label>
          <label for="antiguedadSintomas" class="antiguedad">
            <span>Antigüedad de sintomatología:</span>
            <input type="text" id="antiguedadSintomas" name="antiguedadSintomas" placeholder="Ej: 3 días">
          </label>
        </div>
      </section>

      <section class="section2">
        <h2 class="otros">Otros síntomas</h2>
        <!--
          NOTA PARA EL APRENDIZ:
          Cada checkbox tiene un `name` y un `value`. El `name` agrupa los checkboxes
          relacionados, y el `value` es el dato que se enviará si la casilla está marcada.
          Esto es fundamental para poder recolectar la información en JavaScript.
        -->
        <div class="sintomas-otros">
          <label for="otrosSintomas-fiebre">
            <span>Fiebre</span>
            <input type="checkbox" id="otrosSintomas-fiebre" name="otrosSintomas" value="Fiebre">
          </label>
          <label for="otrosSintomas-dolorAbdominal">
            <span>Dolor abdominal</span>
            <input type="checkbox" id="otrosSintomas-dolorAbdominal" name="otrosSintomas" value="Dolor abdominal">
          </label>
          <label for="otrosSintomas-cefalea">
            <span>Cefalea</span>
            <input type="checkbox" id="otrosSintomas-cefalea" name="otrosSintomas" value="Cefalea">
          </label>
          <!-- Se han añadido ids y names a todos los checkboxes para que sean funcionales -->
        </div>
      </section>

      <section>
        <!-- ERROR CORREGIDO: Se cambió h1 por h2 para una correcta jerarquía de títulos. -->
        <h2 class="antecedentes">Antecedentes</h2>
        <div class="antecedentes2">
          <label for="antecedente-patologico">
            <span>Patológicos</span>
            <input type="checkbox" id="antecedente-patologico" name="antecedentes" value="Patológicos">
          </label>
          <label for="antecedente-toxico">
            <span>Tóxicos</span>
            <input type="checkbox" id="antecedente-toxico" name="antecedentes" value="Tóxicos">
          </label>
          <!-- Se han añadido ids y names a todos los checkboxes para que sean funcionales -->
        </div>
      </section>

      <section>
        <h2 class="signos">Signos vitales</h2>
        <div class="signos-vitales">
          <label for="signos-fa">
            <span>FC (Frecuencia Cardíaca)</span>
            <input type="number" id="signos-fa" name="frecuenciaCardiaca" placeholder="75">
          </label>
          <label for="signos-ta">
            <span>TA (Tensión Arterial)</span>
            <input type="text" id="signos-ta" name="tensionArterial" placeholder="120/80">
          </label>
          <!-- Se han añadido ids y names a todos los inputs para que sean funcionales -->
        </div>
      </section>

      <section>
        <h2 class="examen">Examen físico (Marcar si es ANORMAL)</h2>
        <p>Marque la casilla solamente si el paciente NO cumple con la condición de normalidad.</p>
        <div class="examen-fisico">
          <label for="examen-normocefalo">
            <span>Normocéfalo</span>
            <input type="checkbox" id="examen-normocefalo" name="examenFisicoAnormal" value="Normocéfalo">
          </label>
          <label for="examen-pupilas">
            <span>Pupilas isocóricas</span>
            <input type="checkbox" id="examen-pupilas" name="examenFisicoAnormal" value="Pupilas isocóricas">
          </label>
          <!-- Se han añadido ids y names a todos los checkboxes para que sean funcionales -->
        </div>
      </section>

      <section class="boton">
        <!--
          ERROR CORREGIDO: El botón ahora es de tipo "submit".
          Esto hace que al hacer clic, se dispare el evento "submit" del formulario,
          lo que permitirá que nuestro script en `segundo.js` se ejecute.
          Se eliminó el `onclick` que solo redirigía sin guardar.
        -->
        <button type="submit" class="generar">Generar</button>
      </section>
    </form>
  </main>

  <!--
    ERROR CORREGIDO: Se eliminó la referencia al inexistente `script.js`.

    BUENA PRÁCTICA: Se ha añadido `validaciones.js` antes de `segundo.js`
    para que las funciones de validación estén disponibles cuando `segundo.js` las necesite.
    El atributo `defer` sigue siendo importante para asegurar que el DOM esté listo.
  -->
  <script src="validaciones.js" defer></script>
  <script src="segundo.js" defer></script>
    </body>
</html>
